name: rafiq_mobile
description: "Rafiq Al-Quran Mobile Application - Org/Center/Circle System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Networking
  dio: ^5.4.0
  
  # Routing
  go_router: ^13.0.1
  
  # Serialization & Data Classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  
  # Storage
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # i18n
  intl: ^0.20.2
  
  # Utilities
  logger: ^2.0.2+1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  open_filex: ^4.7.0
  geolocator: ^11.1.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  hijri_calendar: ^1.0.7+1
  url_launcher: ^6.3.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
