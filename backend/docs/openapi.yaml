openapi: 3.0.3
info:
  title: Rafiq Al-Quran API
  version: 2.19.0
  description: Release baseline API contract for current backend endpoints.
servers:
  - url: http://localhost:4000
    description: Current runtime
  - url: http://localhost:4000
    description: Development
  - url: https://staging.api.rafiq.example
    description: Staging
  - url: https://api.rafiq.example
    description: Production
tags:
  - name: Auth
  - name: Users
  - name: Centers
  - name: Halaqat
  - name: Dashboard
  - name: Attendance
  - name: FollowUps
  - name: Exams
  - name: Quran
  - name: Corrections
  - name: Library
  - name: Finance
  - name: Reports
  - name: Notifications
  - name: Audit
  - name: System
  - name: Docs
security:
