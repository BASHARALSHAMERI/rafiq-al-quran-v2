components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: true
      required:
        - ok
    ErrorEnvelope:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details: {}
          required:
            - code
            - message
            - requestId
        message:
          type: string
        details: {}
      required:
        - ok
        - error
    HealthData:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        uptimeMs:
          type: integer
        uptimeSec:
          type: integer
        now:
          type: string
          format: date-time
    Role:
      type: string
      enum:
        - SUPER_ADMIN
        - CENTER_ADMIN
        - SUPERVISOR
        - TEACHER
        - PARENT
        - STUDENT
    Center:
      type: object
      properties:
        id:
          type: integer
        organizationId:
          type: integer
          nullable: true
        name:
          type: string
        code:
          type: string
          nullable: true
        timezone:
          type: string
          example: Asia/Riyadh
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
    Circle:
      type: object
      properties:
        id:
          type: integer
        centerId:
          type: integer
        teacherId:
          type: integer
          nullable: true
        name:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
        weeklySchedule:
          type: array
          items:
            $ref: "#/components/schemas/CircleScheduleRow"
    Weekday:
      type: string
      enum:
        - FRIDAY
        - SATURDAY
        - SUNDAY
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
    CircleScheduleMode:
      type: string
      enum:
        - CLOCK
        - PRAYER
    PrayerName:
      type: string
      enum:
        - FAJR
        - DHUHR
        - ASR
        - MAGHRIB
        - ISHA
    CircleScheduleRowClock:
      type: object
      required:
        - day
        - mode
        - fromTime
        - toTime
      properties:
        day:
          $ref: "#/components/schemas/Weekday"
        mode:
          type: string
          enum:
            - CLOCK
        fromTime:
          type: string
          pattern: ^([01]\\d|2[0-3]):[0-5]\\d$
        toTime:
          type: string
          pattern: ^([01]\\d|2[0-3]):[0-5]\\d$
    CircleScheduleRowPrayer:
      type: object
      required:
        - day
        - mode
        - fromPrayer
        - toPrayer
      properties:
        day:
          $ref: "#/components/schemas/Weekday"
        mode:
          type: string
          enum:
            - PRAYER
        fromPrayer:
          $ref: "#/components/schemas/PrayerName"
        toPrayer:
          $ref: "#/components/schemas/PrayerName"
    CircleScheduleRow:
      oneOf:
        - $ref: "#/components/schemas/CircleScheduleRowClock"
        - $ref: "#/components/schemas/CircleScheduleRowPrayer"
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    UserProfileDetailed:
      allOf:
        - $ref: "#/components/schemas/UserProfile"
        - type: object
          properties:
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true
            centerAccesses:
              type: array
              items:
                type: object
                properties:
                  centerId:
                    type: integer
            circleAccesses:
              type: array
              items:
                type: object
                properties:
                  circleId:
                    type: integer
            studentEnrollments:
              type: array
              items:
                type: object
                properties:
                  circleId:
                    type: integer
            parentLinks:
              type: array
              items:
                type: object
                properties:
                  studentId:
                    type: integer
                  relationType:
                    type: string
    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email or phone number.
        email:
          type: string
          description: "Deprecated: legacy alias for identifier."
          deprecated: true
        password:
          type: string
          minLength: 8
    ForgotPasswordRequest:
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string
          description: Email or phone number.
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 4000
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
