paths:
  /health:
    get:
      tags:
        - System
      summary: Legacy health endpoint
      security: []
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthData"
  /ready:
    get:
      tags:
        - System
      summary: Legacy readiness endpoint
      security: []
      responses:
        "200":
          description: Readiness payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
        "503":
          description: Service unavailable
          content:
            application/json:
              schema: &a1
                $ref: "#/components/schemas/ErrorEnvelope"
  /version:
    get:
      tags:
        - System
      summary: Legacy version endpoint
